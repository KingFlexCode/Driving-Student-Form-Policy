<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="icon" href="/favicon.ico" />
  <title>Avian Driving School — Registration</title>
  <style>
    body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f172a;color:#f8fafc;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:24px}
    .card{background:#111318;border:1px solid #1f2937;border-radius:16px;padding:20px}
    label{display:block;margin:8px 0 4px}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #1f2937;background:#0b1020;color:#f8fafc}
    button{padding:12px 16px;border-radius:10px;border:0;background:#ffcc00;color:#0d1324;font-weight:700;cursor:pointer;margin-top:12px}
    .sig{background:#fff;border-radius:8px;border:1px solid #1f2937;overflow:hidden;margin:8px 0}
    canvas{display:block;width:100%;height:180px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* Style the new Places element like your inputs */
    gmpx-place-autocomplete {
      display:block;
      --gmpx-color-surface:#0b1020;
      --gmpx-color-on-surface:#f8fafc;
      --gmpx-color-outline:#1f2937;
      --gmpx-shape-corner-extra-large:8px;
      border-radius:8px;
      margin:0 0 8px 0;
    }
    /* Keep dropdown above your card */
    .pac-container{z-index:3000!important}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Avian Driving School — Student Registration</h1>

    <form
      name="Avian Registration"
      method="POST"
      action="/success.html"
      data-netlify="true"
      enctype="multipart/form-data"
      class="card"
      aria-labelledby="form-title"
    >
      <h2 id="form-title" class="sr-only">Registration Form</h2>

      <input type="hidden" name="form-name" value="Avian Registration" />
      <p style="display:none"><label>Don’t fill this out: <input name="bot-field" autocomplete="off"/></label></p>

      <label for="firstName">First Name*</label>
      <input id="firstName" name="firstName" required autocomplete="given-name"/>

      <label for="lastName">Last Name*</label>
      <input id="lastName" name="lastName" required autocomplete="family-name"/>

      <label for="email">Email*</label>
      <input id="email" type="email" name="email" required autocomplete="email"/>

      <label for="phone">Phone*</label>
      <input id="phone" name="phone" required autocomplete="tel"/>

      <!-- Address (new web component) -->
      <label for="address1-ac">Street Address*</label>

      <!-- 1) The Google Places web component users type into -->
      <gmpx-place-autocomplete
        id="address1-ac"
        aria-label="Street Address"
        autocomplete-options='{"componentRestrictions":{"country":["us"]}}'
        style="margin-bottom:8px"
      ></gmpx-place-autocomplete>

      <!-- 2) Visible read-only mirror that actually gets submitted -->
      <input
        id="address1"
        name="address1"
        required
        readonly
        placeholder="Start typing above to select an address"
      />
      
      <label for="address2">Address 2</label>
      <input id="address2" name="address2" autocomplete="address-line2"/>

      <label for="city">City*</label>
      <input id="city" name="city" required autocomplete="address-level2"/>

      <label for="state">State* (2 letters)</label>
      <input id="state" name="state" minlength="2" maxlength="2" required autocomplete="address-level1"/>

      <label for="zip">ZIP*</label>
      <input id="zip" name="zip" pattern="\d{5}" required inputmode="numeric" autocomplete="postal-code"/>

      <label for="permitNo">Permit/License #*</label>
      <input id="permitNo" name="permitNo" required/>

      <label for="dob">Date of Birth*</label>
      <input id="dob" type="date" name="dob" required />

      <label for="issueDate">Issue Date*</label>
      <input id="issueDate" type="date" name="issueDate" required/>

      <label for="expDate">Expiration Date*</label>
      <input id="expDate" type="date" name="expDate" required/>

      <label for="package">Package/Service*</label>
      <select id="package" name="package" required>
        <option value="" disabled selected>Please select</option>
        <option value="399">Car Package 2 — $399</option>
        <option value="649">Car Package 3 — $649</option>
        <option value="135">Road Test Car — $135</option>
      </select>

      <label for="fiveHourSlot">5-Hour Class (date/time)*</label>
      <input id="fiveHourSlot" type="datetime-local" name="fiveHourSlot" required/>

      <label for="permitSource">Permit Source*</label>
      <select id="permitSource" name="permitSource" required>
        <option value="" disabled selected>Please select</option>
        <option>Online</option>
        <option>On-site (DMV)</option>
      </select>

      <label for="signHelp">Need help with signs?*</label>
      <select id="signHelp" name="signHelp" required>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="idFront">ID (Front)*</label>
      <input id="idFront" type="file" name="idFront" accept="image/*" capture="environment" required/>

      <label for="idBack">ID (Back)*</label>
      <input id="idBack" type="file" name="idBack" accept="image/*" capture="environment" required/>

      <!-- Signature -->
      <input type="hidden" name="signatureData" id="signatureData" />
      <div class="sig" role="group" aria-labelledby="siglabel">
        <span id="siglabel" class="sr-only">Signature field</span>
        <canvas id="sig"></canvas>
      </div>
      <button type="button" id="clearSig" aria-label="Clear signature">Clear Signature</button>

      <p><label><input type="checkbox" name="agreeTOS" required aria-required="true"/> I agree to the Terms of Service.</label></p>
      <p><label><input type="checkbox" name="agreePrivacy" required aria-required="true"/> I agree to the Privacy Policy.</label></p>
      <p><label><input type="checkbox" name="ack6mo" required aria-required="true"/> I understand all purchases are valid for 6 months and unused lessons expire.</label></p>

      <button type="submit">Submit Registration</button>
    </form>
  </div>

  <!-- Signature pad -->
  <script>
    const c = document.getElementById('sig'), ctx = c.getContext('2d');
    function size(){ const r = window.devicePixelRatio||1; c.width=c.clientWidth*r; c.height=180*r; ctx.setTransform(r,0,0,r,0,0); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111827'; }
    window.addEventListener('resize', size); size();
    let drawing=false,x=0,y=0;
    const set=(a,b)=>{drawing=true;x=a;y=b};
    const draw=(a,b)=>{ if(!drawing)return; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(a,b); ctx.stroke(); x=a;y=b; };
    const end=()=>{ drawing=false; document.getElementById('signatureData').value=c.toDataURL('image/png'); };
    c.addEventListener('mousedown',e=>set(e.offsetX,e.offsetY));
    c.addEventListener('mousemove',e=>draw(e.offsetX,e.offsetY));
    c.addEventListener('mouseup',end); c.addEventListener('mouseleave',end);
    c.addEventListener('touchstart',e=>{const t=e.touches[0],r=c.getBoundingClientRect();set(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchmove',e=>{const t=e.touches[0],r=c.getBoundingClientRect();draw(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchend',end);
    document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);document.getElementById('signatureData').value=''};
    const form = document.querySelector('form[name="Avian Registration"]');
    form.addEventListener('submit',e=>{ if(!document.getElementById('signatureData').value){ e.preventDefault(); alert('Please sign in the box.'); }});
  </script>

  <!-- File size limit: 3.5 MB per image -->
  <script>
    const MAX_BYTES = 3.5 * 1024 * 1024;
    function enforceMaxSize(input){
      if(!input?.files?.length) return true;
      for(const f of input.files){
        if(f.size > MAX_BYTES){
          alert(`"${f.name}" is ${(f.size/1024/1024).toFixed(2)} MB. Please upload images under 3.5 MB.`);
          input.value=''; return false;
        }
      }
      return true;
    }
    const idFrontInput = document.getElementById('idFront');
    const idBackInput  = document.getElementById('idBack');
    [idFrontInput, idBackInput].forEach(el=>el.addEventListener('change',()=>enforceMaxSize(el)));
    document.querySelector('form[name="Avian Registration"]').addEventListener('submit',(e)=>{
      if(!enforceMaxSize(idFrontInput) || !enforceMaxSize(idBackInput)) e.preventDefault();
    });
  </script>

  <!-- Load Google's Extended Component Library (defines <gmpx-*> tags) -->
  <script type="module" src="https://unpkg.com/@googlemaps/extended-component-library@0.6/dist/index.min.js"></script>

  <!-- Glue code + component loader -->
  <script type="module">
    async function wireUpPlaceElement() {
      // Make sure the custom element is defined (provided by the Extended Component Library)
      await customElements.whenDefined('gmpx-place-autocomplete');

      const el      = document.getElementById('address1-ac');
      const mirror  = document.getElementById('address1'); // visible, readonly input
      const cityEl  = document.getElementById('city');
      const stateEl = document.getElementById('state');
      const zipEl   = document.getElementById('zip');

      if (!el || !mirror) {
        console.warn('Autocomplete element or #address1 mirror not found');
        return;
      }

      // While typing (no selection yet), mirror raw text so "required" passes
      el.addEventListener('input', () => {
        mirror.value = el.value || '';
      });

      // When a suggestion is actually chosen
      el.addEventListener('gmpx-placechange', () => {
        const place = el.valuePlace || null;

        // Put formatted address into the mirror input (this is what gets submitted)
        mirror.value =
          place?.formattedAddress ||
          place?.formatted_address ||
          el.value ||
          '';

        // Fill City/State/ZIP
        const comps = place?.addressComponents || [];
        const byType = {};
        comps.forEach(c => (c.types || []).forEach(t => (byType[t] = c)));

        const city  = (byType.locality || byType.sublocality || byType.postal_town)?.longText || '';
        const state = byType.administrative_area_level_1?.shortText || '';
        const zip   = byType.postal_code?.longText || '';

        if (city)  cityEl.value  = city;
        if (state) stateEl.value = state;
        if (zip)   zipEl.value   = zip;
      });

      console.log('Place Autocomplete wired ✓');
    }

    // Expose for the API loader onload
    window.__afterGmpxLoaded = wireUpPlaceElement;
  </script>

  <!-- Extended Component Library (defines <gmpx-*> elements) -->
  <script type="module" src="https://unpkg.com/@googlemaps/extended-component-library@0.6/dist/index.min.js"></script>

  <!-- Official API loader for components -->
  <gmpx-api-loader
    key="AIzaSyAVCNj2VPiRQpoZHIxoEAAbtW_m5LlZcaY"
    libraries="places"
    onload="__afterGmpxLoaded()">
  </gmpx-api-loader>

</body>
</html>

</body>
</html>
