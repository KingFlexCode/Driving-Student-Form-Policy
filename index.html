<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Avian Driving School — Registration</title>
  <style>
    body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f172a;color:#f8fafc;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:24px}
    .card{background:#111318;border:1px solid #1f2937;border-radius:16px;padding:20px}
    label{display:block;margin:8px 0 4px}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #1f2937;background:#0b1020;color:#f8fafc}
    button{padding:12px 16px;border-radius:10px;border:0;background:#ffcc00;color:#0d1324;font-weight:700;cursor:pointer;margin-top:12px}
    .sig{background:#fff;border-radius:8px;border:1px solid #1f2937;overflow:hidden;margin:8px 0}
    canvas{display:block;width:100%;height:180px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Avian Driving School — Student Registration</h1>

    <!-- Netlify must see this at build time -->
    <form
      name="Avian Registration"
      method="POST"
      action="/success.html"
      data-netlify="true"
      enctype="multipart/form-data"
      class="card">

      <!-- Required hidden input -->
      <input type="hidden" name="form-name" value="Avian Registration" />
      <!-- Optional honeypot -->
      <p style="display:none"><label>Don’t fill this out: <input name="bot-field" /></label></p>

      <label>First Name*</label>
      <input name="firstName" required />

      <label>Last Name*</label>
      <input name="lastName" required />

      <label>Email*</label>
      <input type="email" name="email" required />

      <label>Phone*</label>
      <input name="phone" required />

      <label>Street Address*</label>
      <input name="address1" required />

      <label>Address 2</label>
      <input name="address2" />

      <label>City*</label>
      <input name="city" required />

      <label>State*</label>
      <input name="state" minlength="2" maxlength="2" required />

      <label>ZIP*</label>
      <input name="zip" pattern="\d{5}" required />

      <label>Permit/License #*</label>
      <input name="permitNo" required />

      <label>Issue Date*</label>
      <input type="date" name="issueDate" required />

      <label>Expiration Date*</label>
      <input type="date" name="expDate" required />

      <label>Package/Service*</label>
      <select name="package" required>
        <option value="" disabled selected>Please select</option>
        <option value="399">Car Package 2 — $399</option>
        <option value="649">Car Package 3 — $649</option>
        <option value="135">Road Test Car — $135</option>
      </select>

      <label>5-Hour Class (date/time)*</label>
      <input type="datetime-local" name="fiveHourSlot" required />

      <label>Permit Source*</label>
      <select name="permitSource" required>
        <option value="" disabled selected>Please select</option>
        <option>Online</option>
        <option>On-site (DMV)</option>
      </select>

      <label>Need help with signs?*</label>
      <select name="signHelp" required>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label>ID (Front)*</label>
      <input type="file" name="idFront" accept="image/*" capture="environment" required />

      <label>ID (Back)*</label>
      <input type="file" name="idBack" accept="image/*" capture="environment" required />

      <!-- Signature -->
      <input type="hidden" name="signatureData" id="signatureData" />
      <div class="sig"><canvas id="sig"></canvas></div>
      <button type="button" id="clearSig">Clear Signature</button>

      <p><label><input type="checkbox" name="agreeTOS" required /> I agree to the Terms of Service.</label></p>
      <p><label><input type="checkbox" name="agreePrivacy" required /> I agree to the Privacy Policy.</label></p>
      <p><label><input type="checkbox" name="ack6mo" required /> I understand all purchases are valid for 6 months and unused lessons expire.</label></p>

      <button type="submit">Submit Registration</button>
    </form>
  </div>

  <!-- Signature pad -->
  <script>
    const c = document.getElementById('sig'), ctx = c.getContext('2d');
    function size(){ const r = window.devicePixelRatio||1; c.width=c.clientWidth*r; c.height=180*r; ctx.setTransform(r,0,0,r,0,0); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111827'; }
    window.addEventListener('resize', size); size();
    let drawing=false,x=0,y=0;
    const set=(a,b)=>{drawing=true;x=a;y=b};
    const draw=(a,b)=>{ if(!drawing)return; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(a,b); ctx.stroke(); x=a;y=b; };
    const end=()=>{ drawing=false; document.getElementById('signatureData').value=c.toDataURL('image/png'); };
    c.addEventListener('mousedown',e=>set(e.offsetX,e.offsetY));
    c.addEventListener('mousemove',e=>draw(e.offsetX,e.offsetY));
    c.addEventListener('mouseup',end); c.addEventListener('mouseleave',end);
    c.addEventListener('touchstart',e=>{const t=e.touches[0],r=c.getBoundingClientRect();set(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchmove',e=>{const t=e.touches[0],r=c.getBoundingClientRect();draw(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchend',end);
    document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);document.getElementById('signatureData').value=''};
    const form = document.querySelector('form[name="Avian Registration"]');
    form.addEventListener('submit',e=>{ if(!document.getElementById('signatureData').value){ e.preventDefault(); alert('Please sign in the box.'); }});
  </script>

  <!-- Image compression + size limits -->
  <script>
    const MAX_WIDTH  = 1600;
    const MAX_HEIGHT = 1600;
    const JPEG_QUALITY = 0.76;
    const MAX_BYTES_AFTER = 1.5 * 1024 * 1024; // 1.5 MB per image

    function fileToDataURL(file){
      return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(file); });
    }
    async function downscaleToJpeg(file,maxW=MAX_WIDTH,maxH=MAX_HEIGHT,quality=JPEG_QUALITY){
      const dataUrl = await fileToDataURL(file);
      if(!/^data:image\//.test(dataUrl)) return file; // skip non-images
      const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=dataUrl; });
      const ratio = Math.min(maxW/img.width, maxH/img.height, 1);
      const w = Math.round(img.width*ratio), h = Math.round(img.height*ratio);
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,w,h);
      const blob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',quality));
      if(!blob) return file;
      const name=(file.name.replace(/\.[^.]+$/,'')||'upload')+'.jpg';
      return new File([blob], name, {type:'image/jpeg', lastModified:Date.now()});
    }
    async function processInputImages(inputEl){
      if(!inputEl?.files?.length) return true;
      const dt = new DataTransfer();
      for(const original of Array.from(inputEl.files)){
        const isImage = original.type.startsWith('image/');
        const isPdf = original.type === 'application/pdf';

        // Optionally reject large PDFs:
        if(isPdf && original.size > MAX_BYTES_AFTER){
          alert('PDF too large. Please upload a clear photo under 1.5 MB.');
          inputEl.value=''; return false;
        }

        let processed = original;
        if(isImage && original.size > 400*1024){
          try{ processed = await downscaleToJpeg(original); }catch(e){ console.warn('Compression failed, keeping original:', e); }
        }
        if(processed.size > MAX_BYTES_AFTER){
          alert(`Please upload images under ${(MAX_BYTES_AFTER/1024/1024).toFixed(1)} MB. "${processed.name}" is ${(processed.size/1024/1024).toFixed(2)} MB.`);
          inputEl.value=''; return false;
        }
        dt.items.add(processed);
      }
      inputEl.files = dt.files;
      return true;
    }

    const idFrontInput = document.querySelector('input[name="idFront"]');
    const idBackInput  = document.querySelector('input[name="idBack"]');

    [idFrontInput, idBackInput].forEach(el=>{
      if(!el) return;
      el.addEventListener('change', async ()=>{ await processInputImages(el); });
    });

    form.addEventListener('submit', async (e)=>{
      const okFront = await processInputImages(idFrontInput);
      const okBack  = await processInputImages(idBackInput);
      if(!okFront || !okBack){ e.preventDefault(); }
    });
  </script>

  <!-- Google Map address auto suggestion -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAVCNj2VPiRQpoZHIxoEAAbtW_m5LlZcaY&libraries=places"></script>
</body>
</html>
