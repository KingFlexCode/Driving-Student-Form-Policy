<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Avian Driving School — Registration</title>
  <style>
    body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0f172a;color:#f8fafc;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:24px}
    .card{background:#111318;border:1px solid #1f2937;border-radius:16px;padding:20px}
    label{display:block;margin:8px 0 4px}
    input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #1f2937;background:#0b1020;color:#f8fafc}
    button{padding:12px 16px;border-radius:10px;border:0;background:#ffcc00;color:#0d1324;font-weight:700;cursor:pointer;margin-top:12px}
    .sig{background:#fff;border-radius:8px;border:1px solid #1f2937;overflow:hidden;margin:8px 0}
    canvas{display:block;width:100%;height:180px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Avian Driving School — Student Registration</h1>

    <!-- IMPORTANT: Netlify must see this markup at build time -->
    <form
      name="Avian Registration"
      method="POST"
      action="/success.html"
      data-netlify="true"
      enctype="multipart/form-data"
      netlify
      class="card"
    >
      <!-- required hidden input -->
      <input type="hidden" name="form-name" value="Avian Registration" />
      <!-- optional honeypot -->
      <p style="display:none"><label>Don’t fill this out: <input name="bot-field"/></label></p>

      <label>First Name*</label>
      <input name="firstName" required>
      <label>Last Name*</label>
      <input name="lastName" required>
      <label>Email*</label>
      <input type="email" name="email" required>
      <label>Phone*</label>
      <input name="phone" required>

      <label>Street Address*</label>
      <input name="address1" required>
      <label>Address 2</label>
      <input name="address2">
      <label>City*</label>
      <input name="city" required>
      <label>State*</label>
      <input name="state" minlength="2" maxlength="2" required>
      <label>ZIP*</label>
      <input name="zip" pattern="\d{5}" required>

      <label>Permit/License #*</label>
      <input name="permitNo" required>
      <label>Issue Date*</label>
      <input type="date" name="issueDate" required>
      <label>Expiration Date*</label>
      <input type="date" name="expDate" required>

      <label>Package/Service*</label>
      <select name="package" required>
        <option value="" disabled selected>Please select</option>
        <option value="399">Car Package 2 — $399</option>
        <option value="649">Car Package 3 — $649</option>
        <option value="135">Road Test Car — $135</option>
      </select>

      <label>5-Hour Class (date/time)*</label>
      <input type="datetime-local" name="fiveHourSlot" required>

      <label>Permit Source*</label>
      <select name="permitSource" required>
        <option value="" disabled selected>Please select</option>
        <option>Online</option><option>On-site (DMV)</option>
      </select>

      <label>Need help with signs?*</label>
      <select name="signHelp" required><option>Yes</option><option>No</option></select>

      <label>ID (Front)*</label>
      <input type="file" name="idFront" accept="image/*,application/pdf" required>
      <label>ID (Back)*</label>
      <input type="file" name="idBack" accept="image/*,application/pdf" required>

      <!-- Signature (canvas -> base64) -->
      <input type="hidden" name="signatureData" id="signatureData" />
      <div class="sig"><canvas id="sig"></canvas></div>
      <button type="button" id="clearSig">Clear Signature</button>

      <p><label><input type="checkbox" name="agreeTOS" required> I agree to the Terms of Service.</label></p>
      <p><label><input type="checkbox" name="agreePrivacy" required> I agree to the Privacy Policy.</label></p>
      <p><label><input type="checkbox" name="ack6mo" required> I understand all purchases are valid for 6 months and unused lessons expire.</label></p>

      <button type="submit">Submit Registration</button>
    </form>
  </div>
  <script>
    // simple signature pad
    const c=document.getElementById('sig'), ctx=c.getContext('2d');
    function size(){const r=window.devicePixelRatio||1;c.width=c.clientWidth*r;c.height=180*r;ctx.scale(r,r);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111827'}
    window.addEventListener('resize', size); size();
    let d=false,x=0,y=0; const set=(a,b)=>{d=true;x=a;y=b}; const draw=(a,b)=>{if(!d)return;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke();x=a;y=b}; const end=()=>{d=false;document.getElementById('signatureData').value=c.toDataURL('image/png')}
    c.addEventListener('mousedown',e=>set(e.offsetX,e.offsetY)); c.addEventListener('mousemove',e=>draw(e.offsetX,e.offsetY)); c.addEventListener('mouseup',end); c.addEventListener('mouseleave',end);
    c.addEventListener('touchstart',e=>{const t=e.touches[0],r=c.getBoundingClientRect();set(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchmove',e=>{const t=e.touches[0],r=c.getBoundingClientRect();draw(t.clientX-r.left,t.clientY-r.top)},{passive:true});
    c.addEventListener('touchend',end);
    document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);document.getElementById('signatureData').value=''};
    document.querySelector('form').addEventListener('submit',e=>{ if(!document.getElementById('signatureData').value){ e.preventDefault(); alert('Please sign in the box.'); }});
    </script>
  <script>
/**
 * Compress an image File in the browser.
 * Returns a new File (JPEG) with reduced dimensions/size.
 */
function compressImageFile(file, {maxW=1600, maxH=1600, quality=0.75} = {}) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return resolve(file); // skip non-images (e.g., PDFs)

    // If already small (<400KB), skip compression
    if (file.size < 400 * 1024) return resolve(file);

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const ratio = Math.min(maxW / width, maxH / height, 1); // never upscale
        const w = Math.round(width * ratio);
        const h = Math.round(height * ratio);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        // Try JPEG first (best size); fallback to PNG if needed
        canvas.toBlob(
          (blob) => {
            if (!blob) return reject(new Error('Compression failed'));
            const compressed = new File(
              [blob],
              (file.name.replace(/\.[^.]+$/, '') || 'upload') + '.jpg',
              { type: 'image/jpeg', lastModified: Date.now() }
            );
            resolve(compressed);
          },
          'image/jpeg',
          quality
        );
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Replace the file(s) in an <input type="file"> with the compressed versions
async function compressInputFiles(inputEl) {
  const dt = new DataTransfer();
  const files = Array.from(inputEl.files || []);
  for (const f of files) {
    // Only attempt to compress images
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const isImage = f.type.startsWith('image/') || ['jpg','jpeg','png','webp','heic','heif'].includes(ext);
    const processed = isImage ? await compressImageFile(f, { maxW: 1600, maxH: 1600, quality: 0.75 }) : f;
    dt.items.add(processed);
  }
  inputEl.files = dt.files;
}

// Hook up your two file inputs
const idFrontInput = document.querySelector('input[name="idFront"]');
const idBackInput  = document.querySelector('input[name="idBack"]');

[idFrontInput, idBackInput].forEach((el) => {
  if (!el) return;
  el.addEventListener('change', async () => {
    try {
      await compressInputFiles(el);
      // Optional: enforce max size (e.g., 1MB)
      const tooBig = Array.from(el.files).some(f => f.size > 1024 * 1024);
      if (tooBig) {
        alert('Please upload images under 1 MB after compression.');
        el.value = ''; // clear
      }
    } catch (e) {
      console.warn('Compression skipped/failed:', e);
    }
  });
});
    </script>
</body>
</html>
